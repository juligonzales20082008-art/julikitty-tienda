<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julikitty ‑ Tienda Hello Kitty</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
background-color: #fff7fb;
color: #333;
}
h1, h2 {
text-align: center;
padding: 20px;
}
nav {
background-color: #ffb8d6;
padding: 12px;
}
nav a {
margin: 0 12px;
text-decoration: none;
color: #222;
font-weight: bold;
}
section {
padding: 30px 15px;
max-width: 1200px;
margin: 0 auto;
}
.product-container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 20px;
}
.card {
background: white;
border-radius: 16px;
padding: 15px;
box-shadow: 0 4px 10px rgba(0,0,0,0.1);
text-align: center;
}
.card img {
width: 100%;
height: 220px;
object-fit: cover;
border-radius: 12px;
}
.price {
font-weight: bold;
color: #e84a8a;
margin-top: 10px;
font-size: 18px;
}
button {
background-color: #e84a8a;
color: white;
border: none;
padding: 10px 18px;
border-radius: 8px;
margin-top: 12px;
cursor: pointer;
font-weight: bold;
}
button:hover {
background-color: #c93972;
}
</style>
</head>
<body>
<nav>
<a href="#inicio">Inicio</a>
<a href="#productos">Productos</a>
<a href="#contacto">Contacto</a>
</nav>
<h1>🎀 Tienda Julikitty</h1>
<section id="productos">
<h2>✨ Nuestros Productos</h2>
<div class="product-container">
<div class="card">
<img src="https://via.placeholder.com/400x220?text=Hello+Kitty+Peluche" alt="Peluche Hello Kitty">
<h3>Peluche Hello Kitty</h3>
<p class="price">$35.000 COP</p>
<button>Comprar</button>
</div>
<div class="card">
<img src="https://via.placeholder.com/400x220?text=Hello+Kitty+Mug" alt="Taza Hello Kitty">
<h3>Taza Hello Kitty</h3>
<p class="price">$18.000 COP</p>
<button>Comprar</button>
</div>
<div class="card">
<img src="https://via.placeholder.com/400x220?text=Hello+Kitty+Llavero" alt="Llavero Hello Kitty">
<h3>Llavero Hello Kitty</h3>
<p class="price">$12.000 COP</p>
<button>Comprar</button>
</div>
</div>
</section>
<section id="contacto">
<h2>💖 Contáctanos</h2>
<p style="text-align:center; padding:15px;">Correo: julikitty‑tienda@ejemplo.com</p>
</section>
</body>
</html>
